server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  # WebFlux es reactivo: sin esto, el MDC (traceId/spanId/userId) no sobrevive el salto
  # de un operador de Reactor a otro y los logs pierden la correlación con la traza.
  reactor:
    context-propagation: auto
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
      default-filters:
        - RequestHeaderFilter
      routes:
        # -------------------------------------------------------------------
        # 1. RUTAS PÚBLICAS DEL MONOLITO (Auth / Login / Register / Refresh)
        # SIN AuthenticationFilter
        # -------------------------------------------------------------------
        - id: monolith-public-auth
          uri: ${MONOLITH_URI:http://finbank-monolith:8081}
          predicates:
            - Path=/api/v1/auth/login, /api/v1/auth/register, /api/v1/auth/refresh
          filters:
            - StripPrefix=2

        # -------------------------------------------------------------------
        # 2. MICROSERVICIO DE NOTIFICACIONES (PROTEGIDO CON JWT)
        # -------------------------------------------------------------------
        - id: ms-notifications-route
          uri: ${MS_NOTIFICATIONS_URI:http://ms-notifications:8082}
          predicates:
            - Path=/api/v1/notifications, /api/v1/notifications/**
          filters:
            - AuthenticationFilter

        # -------------------------------------------------------------------
        # 3. MICROSERVICIO DE TRANSFERENCIAS (PROTEGIDO CON JWT)
        # -------------------------------------------------------------------
        - id: ms-transfers-route
          uri: ${MS_TRANSFERS_URI:http://ms-transfers:8083}
          predicates:
            - Path=/api/v1/transfers, /api/v1/transfers/**
          filters:
            - AuthenticationFilter

        # -------------------------------------------------------------------
        # 4. RUTAS PROTEGIDAS DEL MONOLITO (Core del banco)
        # Catch-all de /api/v1/**
        # -------------------------------------------------------------------
        - id: monolith-protected-route
          uri: ${MONOLITH_URI:http://finbank-monolith:8081}
          predicates:
            - Path=/api/v1/**
          filters:
            - StripPrefix=2
            - AuthenticationFilter

# Secret para el JWT
jwt:
  secret: ${JWT_SECRET:modular-bank-dev-secret-change-in-production-256bit}

# -----------------------------------------------------------------------------
# Documentación: una única especificación OpenAPI, servida por el propio Gateway
# (ver OpenApiConfig). El Monolito y ms-notifications ya no exponen swagger — sus
# endpoints públicos se documentan aquí, a mano, como parte de la API unificada.
# -----------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  # ---------------------------------------------------------------------------
  # Trazas distribuidas: Micrometer Tracing (bridge Brave) -> Zipkin. Ver ADR-0001.
  # ---------------------------------------------------------------------------
  tracing:
    sampling:
      probability: 1.0 # 100% en dev/demo; bajar en producción (p. ej. 0.1)
    propagation:
      type: W3C # cabecera estándar `traceparent`, en vez de B3 propietario
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://zipkin:9411/api/v2/spans}
  # ---------------------------------------------------------------------------
  # Métricas: expuestas en formato Prometheus. P99 de latencia habilitado por
  # meter explícitamente (Prometheus calcula el percentil real a partir del
  # histograma; sin esto solo se exponen agregados, no percentiles).
  # ---------------------------------------------------------------------------
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
