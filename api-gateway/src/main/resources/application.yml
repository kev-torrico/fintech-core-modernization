server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
      default-filters:
        - RequestHeaderFilter
      routes:
        # -------------------------------------------------------------------
        # 1. RUTAS PÚBLICAS DEL MONOLITO (Auth / Login / Register / Refresh)
        # SIN AuthenticationFilter
        # -------------------------------------------------------------------
        - id: monolith-public-auth
          uri: ${MONOLITH_URI:http://finbank-monolith:8081}
          predicates:
            - Path=/api/v1/auth/login, /api/v1/auth/register, /api/v1/auth/refresh
          filters:
            - StripPrefix=2

        # -------------------------------------------------------------------
        # 2. MICROSERVICIO DE NOTIFICACIONES (PROTEGIDO CON JWT)
        # -------------------------------------------------------------------
        - id: ms-notifications-route
          uri: ${MS_NOTIFICATIONS_URI:http://ms-notifications:8082}
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=2
            - AuthenticationFilter

        # -------------------------------------------------------------------
        # 3. MICROSERVICIO DE TRANSFERENCIAS (PROTEGIDO CON JWT)
        # Cubre tanto POST /api/v1/transfers como GET /api/v1/transfers
        # -------------------------------------------------------------------
        - id: ms-transfers-route
          uri: ${MS_TRANSFERS_URI:http://ms-transfers:8083}
          predicates:
            - Path=/api/v1/transfers/**
          filters:
            - StripPrefix=2
            - AuthenticationFilter

        # -------------------------------------------------------------------
        # 4. RUTAS PROTEGIDAS DEL MONOLITO (Core del banco)
        # Catch-all de /api/v1/** (salvo las declaradas arriba)
        # -------------------------------------------------------------------
        - id: monolith-protected-route
          uri: ${MONOLITH_URI:http://finbank-monolith:8081}
          predicates:
            - Path=/api/v1/**
          filters:
            - StripPrefix=2
            - AuthenticationFilter

# Secret para el JWT
jwt:
  secret: ${JWT_SECRET:modular-bank-dev-secret-change-in-production-256bit}

# -----------------------------------------------------------------------------
# Documentación: una única especificación OpenAPI, servida por el propio Gateway
# (ver OpenApiConfig). El Monolito y ms-notifications ya no exponen swagger — sus
# endpoints públicos se documentan aquí, a mano, como parte de la API unificada.
# -----------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
