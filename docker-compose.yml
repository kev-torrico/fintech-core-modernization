networks:
  finbank-net:
    driver: bridge

volumes:
  postgres_monolith_data:
  postgres_notifications_data:

services:
  # ========================================================
  # 0. BROKER DE EVENTOS
  # ========================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - finbank-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "29092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - finbank-net

  akhq:
    image: tchiotludo/akhq:latest
    container_name: akhq
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            finbank-cluster:
              properties:
                bootstrap.servers: "kafka:29092"
    ports:
      - "8085:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - finbank-net

  # ========================================================
  # 1. MONOLITO MODULAR Y SU BD
  # ========================================================
  postgres-monolith:
    image: postgres:16
    container_name: postgres-monolith
    environment:
      POSTGRES_DB: modular_bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U bank -d modular_bank'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      - postgres_monolith_data:/var/lib/postgresql/data
    networks:
      - finbank-net

  finbank-monolith:
    build:
      context: ./finbank-monolith
      dockerfile: Dockerfile
    container_name: finbank-monolith
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-monolith:5432/modular_bank
      - SPRING_DATASOURCE_USERNAME=bank
      - SPRING_DATASOURCE_PASSWORD=bank
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SERVER_PORT=8081
    depends_on:
      postgres-monolith:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - finbank-net

  # ========================================================
  # 2. MICROSERVICIO NOTIFICACIONES Y SU BD EXCLUSIVA
  # ========================================================
  postgres-notifications:
    image: postgres:15-alpine
    container_name: postgres-notifications
    environment:
      POSTGRES_DB: finbank_notifications_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "sh -c 'pg_isready -U postgres -d finbank_notifications_db'",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      - postgres_notifications_data:/var/lib/postgresql/data
    networks:
      - finbank-net

  ms-notifications:
    build:
      context: ./ms-notifications
      dockerfile: Dockerfile
    container_name: ms-notifications
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-notifications:5432/finbank_notifications_db?sslmode=disable
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SERVER_PORT=8082
    depends_on:
      postgres-notifications:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - finbank-net

  # ========================================================
  # 3. MICROSERVICIO TRANSFERENCIAS Y SU BD EXCLUSIVA
  # ========================================================
  postgres-transfers:
    image: postgres:15-alpine
    container_name: postgres-transfers
    environment:
      POSTGRES_DB: finbank_transfers_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "sh -c 'pg_isready -U postgres -d finbank_transfers_db'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      - postgres_transfers_data:/var/lib/postgresql/data
    networks:
      - finbank-net

  ms-transfers:
    build:
      context: ./ms-transfers
      dockerfile: Dockerfile
    container_name: ms-transfers
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-transfers:5432/finbank_transfers_db?sslmode=disable
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SERVER_PORT=8083
    depends_on:
      postgres-transfers:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - finbank-net

  # ========================================================
  # 3. API GATEWAY
  # ========================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - MONOLITH_URI=http://finbank-monolith:8081
      - MS_NOTIFICATIONS_URI=http://ms-notifications:8082
      - JWT_SECRET=${JWT_SECRET:-modular-bank-dev-secret-change-in-production-256bit}
      - SERVER_PORT=8080
    depends_on:
      - ms-notifications
      - finbank-monolith
    networks:
      - finbank-net
