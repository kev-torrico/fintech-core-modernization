server:
  port: 8083

spring:
  main:
    # spring-boot-starter-webflux está presente solo para usar WebClient; la app sigue
    # siendo Spring MVC sobre Tomcat, no reactiva.
    web-application-type: servlet
  application:
    name: ms-transfers
  datasource:
    url: jdbc:postgresql://postgres-transfers:5432/finbank_transfers_db?sslmode=disable
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

# Vuelta al api-gateway para validar cuentas (GET /api/v1/accounts, /accounts/{id}/exists),
# reenviando el mismo Bearer token del usuario autenticado.
finbank:
  gateway:
    uri: ${GATEWAY_URI:http://api-gateway:8080}
  kafka:
    topics:
      notifications: notification-events
      transfers: transfer-events

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
