server:
  port: 8082

spring:
  application:
    name: ms-notifications
  datasource:
    url: jdbc:postgresql://postgres-notifications:5432/finbank_notifications_db?sslmode=disable
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
