server:
  port: 8082

spring:
  application:
    name: ms-notifications
  datasource:
    url: jdbc:postgresql://postgres-notifications:5432/finbank_notifications_db?sslmode=disable
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ms-notifications
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.finbank.notifications.infrastructure.kafka.NotificationEvent
    # Habilita que @KafkaListener cree un span hijo de la traza propagada en los headers
    # del mensaje (traceparent) — así el consumo de notification-events queda enlazado a
    # la traza que arrancó en el api-gateway / ms-transfers.
    listener:
      observation-enabled: true

finbank:
  kafka:
    topics:
      notifications: notification-events

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: W3C
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://zipkin:9411/api/v2/spans}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
