spring:
  application:
    name: finbank-monolith
  datasource:
    url: jdbc:postgresql://localhost:5432/modular_bank
    username: ${DB_USER:bank}
    password: ${DB_PASSWORD:bank}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: finbank-monolith-audit
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.modularbank.modules.audit.infrastructure.kafka.TransferAuditEvent
    # Habilita que @KafkaListener cree un span hijo de la traza propagada en los headers
    # del mensaje (traceparent) — así el consumo de transfer-events queda enlazado a la
    # traza que arrancó en el api-gateway / ms-transfers.
    listener:
      observation-enabled: true

jwt:
  secret: ${JWT_SECRET:modular-bank-dev-secret-change-in-production-256bit}
  access-expiration-minutes: 80
  refresh-expiration-days: 7

finbank:
  kafka:
    topics:
      notifications: notification-events
      transfers: transfer-events

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: W3C
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://zipkin:9411/api/v2/spans}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99

server:
  port: 8081
