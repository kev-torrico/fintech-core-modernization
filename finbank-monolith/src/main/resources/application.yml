spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/modular_bank
    username: ${DB_USER:bank}
    password: ${DB_PASSWORD:bank}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: finbank-monolith-audit
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.modularbank.modules.audit.infrastructure.kafka.TransferAuditEvent

jwt:
  secret: ${JWT_SECRET:modular-bank-dev-secret-change-in-production-256bit}
  access-expiration-minutes: 80
  refresh-expiration-days: 7

finbank:
  kafka:
    topics:
      notifications: notification-events
      transfers: transfer-events

server:
  port: 8081
